server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: instantshare-backend
  datasource:
    url: ${MYSQL_DB_URL:jdbc:mysql://${MYSQL_DB_HOST:localhost}:${MYSQL_DB_PORT:3306}/${MYSQL_DB_NAME:instantshare}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=CONVERT_TO_NULL}
    username: ${MYSQL_DB_USERNAME:root}
    password: ${MYSQL_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: InstantShareHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000
      leak-detection-threshold: 60000
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false

# InstantShare Application Settings
instantshare:
  jwt:
    # 256-bit key for HMAC-SHA256
    secret: ${JWT_SECRET:InstantShareSecureJwtSecretKeyForHyperlocalMarketplaceMustBeAtLeast32BytesLong}
    expiration-ms: 86400000 # 24 hours
  payment:
    mode: DEMO # DEMO or LIVE
    currency: INR
    platform-fee-percent: 10.0 # 10% platform commission
    demo:
      auto-confirm: false # If true, checkout immediately confirms; if false, requires demo confirm / simulated webhook
  gps:
    supported-radii-meters: [100, 200, 300]
    default-radius-meters: 200
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

logging:
  level:
    root: INFO
    com.instantshare: DEBUG
    org.hibernate.SQL: WARN
